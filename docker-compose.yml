services:
  travel-inspirator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-travel-inspirator:latest
    container_name: ai-travel-inspirator
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PROVIDER: ${PROVIDER:-self-hosted}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://quasarmarket.coforge.com/qag/llmrouter-api/v2/chat/completions}
      MODEL: ${MODEL:-gpt-5.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      MAX_TOKENS: ${MAX_TOKENS:-4000}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-300}
      DEV_BEARER_TOKEN: ${DEV_BEARER_TOKEN:-dev-token-123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
